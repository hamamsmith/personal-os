<main class="main-content" id="main-content"></main>
<!-- TAKE CONTROL FORM MODAL -->
<div class="modal-overlay" id="battleModal">
<div class="modal-content">
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
<h3 style="margin-bottom: 0;" data-i18n="modal_battle_title">Take Control</h3>
<span onclick="closeBattleModal()" style="cursor:pointer; font-size: 24px; color: var(--text-muted); line-height: 1;">Ã—</span>
</div>
<!-- Step 1: Tanggal -->
<label data-i18n="lbl_battle_date">1. Date (Today/Yesterday)</label>
<div class="picker-container" style="margin-bottom: 20px;">
<select id="battleDatePicker" style="font-size: 15px;"></select>
<span class="lbl">?</span>
</div>
<!-- Step 2: Trigger -->
<label data-i18n="lbl_battle_trigger">2. Select Trigger</label>
<div class="picker-container" style="margin-bottom: 10px;">
<select id="battleTypeVal" onchange="checkCustomTrigger()" style="font-size: 15px;">
<option disabled="" selected="" value="" data-i18n="opt_battle_trigger_default">Select trigger...</option>
</select>
<span class="lbl">?</span>
</div>
<input id="customTriggerInput" placeholder="Type your trigger here..." data-i18n="ph_battle_custom_trigger" style="display:none; margin-bottom: 20px; font-size: 15px; padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.2); color: var(--text-main); width: 100%; box-sizing: border-box; outline: none;" type="text"/>
<input id="battleKategoriVal" type="hidden" value="Lainnya"/>
<!-- Step 3: Hasil -->
<label data-i18n="lbl_battle_outcome">3. Outcome</label>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
<div class="radio-btn" data-i18n="lbl_battle_win" onclick="selectRadio(this, 'battleOutcome')">? Win</div>
<div class="radio-btn" data-i18n="lbl_battle_lose" onclick="selectRadio(this, 'battleOutcome')">? Lose</div>
</div>
<input id="battleOutcomeVal" type="hidden"/>
<!-- Step 4: Catatan -->
<label data-i18n="lbl_battle_note">4. Notes (Optional)</label>
<textarea id="battleNote" placeholder="Write brief context..." data-i18n="ph_battle_note"></textarea>
<button class="btn-submit" data-i18n="btn_save" onclick="submitBattle()">SAVE</button>
</div>
</div>
<!-- BATTLE DETAIL POPUP -->
<div class="modal-overlay" id="battleDetailModal" onclick="if(event.target===this)closeBattleDetail()">
<div class="modal-content">
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
<div>
<h3 id="battleDetailTitle" style="margin-bottom: 4px;">-</h3>
<p id="battleDetailSub" style="font-size: 12px; color: var(--text-muted);">-</p>
</div>
<span onclick="closeBattleDetail()" style="cursor:pointer; font-size: 24px; color: var(--text-muted); line-height: 1;">Ã—</span>
</div>
<div id="battleDetailList" style="max-height: 60vh; overflow-y: auto;"></div>
</div>
