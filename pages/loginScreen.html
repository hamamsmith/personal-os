<div id="loginScreen" class="auth-box">
<div class="auth-logo">Personal<span>OS</span></div>
<div class="auth-title" data-i18n="login_secured">INITIATE SESSION</div>
<form onsubmit="loginOS(event)">
<input class="auth-input" placeholder="Username" required="" type="text"/>
<input class="auth-input" placeholder="Password" required="" type="password"/>
<button class="auth-btn" data-i18n="btn_access" type="submit">LOGIN</button>
</form>
<a class="auth-link" onclick="showSignupScreen()" data-i18n="link_signup">Don't have an account? Sign up</a>
</div>
