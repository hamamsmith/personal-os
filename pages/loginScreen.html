<div id="loginScreen" class="auth-screen" style="display: none;">
<div class="auth-card">
<div class="auth-head">
<div class="auth-logo">Personal<span>OS</span></div>
<h2>Welcome back</h2>
<p>Enter your credentials to open your vault.</p>
</div>
<form onsubmit="loginOS(event)">
<label class="auth-field">
<span>Username</span>
<input class="auth-input" name="username" required="" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="your_handle"/>
</label>
<label class="auth-field">
<span>Password</span>
<input class="auth-input" name="password" required="" type="password" autocomplete="current-password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"/>
</label>
<button class="auth-btn" type="submit">Sign In</button>
</form>
<p class="auth-switch">No account yet? <a href="#signup" onclick="showSignupScreen(); return false;">Create one</a></p>
</div>
</div>
