<div id="signupScreen" class="auth-screen" style="display: none;">
<div class="auth-card">
<div class="auth-head">
<div class="auth-logo">Personal<span>OS</span></div>
<h2>Create your account</h2>
<p>Pick a handle. Your vault begins now.</p>
</div>
<form onsubmit="signupOS(event)">
<label class="auth-field">
<span>Username</span>
<input class="auth-input" name="username" required="" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="your_handle"/>
</label>
<label class="auth-field">
<span>Email</span>
<input class="auth-input" name="email" required="" type="email" autocomplete="email" placeholder="you@example.com"/>
</label>
<label class="auth-field">
<span>Password</span>
<input class="auth-input" name="password" required="" type="password" autocomplete="new-password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"/>
</label>
<label class="auth-field">
<span>Confirm password</span>
<input class="auth-input" name="confirm-password" required="" type="password" autocomplete="new-password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"/>
</label>
<button class="auth-btn" type="submit">Create Account</button>
</form>
<div class="auth-divider"><span>atau</span></div>
<button class="google-btn" type="button" onclick="showToast('Google sign-in coming soon')"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Continue with Google</button>
<p class="auth-switch">Already have an account? <a href="#login" onclick="showLoginScreen(); return false;">Sign in</a></p>
</div>
</div>
