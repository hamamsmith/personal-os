<div id="signupScreen" class="auth-box">
<div class="auth-logo">Personal<span>OS</span></div>
<div class="auth-title" data-i18n="signup_title">CREATE ACCOUNT</div>
<form onsubmit="signupOS(event)">
<input class="auth-input" placeholder="Username" required="" type="text"/>
<input class="auth-input" placeholder="Email" required="" type="email"/>
<input class="auth-input" placeholder="Password" required="" type="password"/>
<input class="auth-input" placeholder="Confirm Password" required="" type="password"/>
<button class="auth-btn" data-i18n="btn_signup" type="submit">REGISTER</button>
</form>
<a class="auth-link" onclick="showLoginScreen()" data-i18n="link_login">Already have an account? Login</a>
</div>
